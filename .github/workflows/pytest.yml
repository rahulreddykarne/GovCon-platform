name: pytest

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govcon
          POSTGRES_USER: govcon
          POSTGRES_PASSWORD: govcon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcon -d govcon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://govcon:govcon@localhost:5432/govcon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -q
