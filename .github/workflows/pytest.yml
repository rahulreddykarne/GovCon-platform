name: pytest

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govcon
          POSTGRES_USER: govcon
          POSTGRES_PASSWORD: govcon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcon -d govcon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://govcon:govcon@localhost:5432/govcon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Typecheck
        run: python -m mypy --python-version 3.12 src/govcon

      - name: Lint
        run: python -m ruff check src tests stubs

      - name: Verify installed wheel startup and database bootstrap
        run: python -m pytest tests/test_installed_artifact.py -q

      - name: Require zero lint and type errors
        run: python scripts/check_static.py

      - name: Verify workspace progress preserves forms and retries failures
        run: node --test tests/web_progress.test.cjs

      - name: Verify isolated release lifecycle and recovery
        run: python -m pytest tests/test_release_lifecycle.py tests/test_f29_f33_regressions.py -q

      - name: Run tests
        run: |
          python -m pytest -q

  # Windows: no pgvector service container is available on Windows runners,
  # so database-backed tests skip and everything else runs (prompt loading,
  # line endings, encodings, extraction, safe fetch, transition tables).
  test-windows:
    runs-on: windows-latest
    env:
      GOVCON_TEST_NO_DB: "1"
      DATABASE_URL: postgresql+psycopg://govcon:govcon@127.0.0.1:5432/govcon
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests (database tests skipped)
        run: |
          python -m pytest -q

      - name: Require zero lint and type errors
        run: python scripts/check_static.py

      - name: Verify workspace progress preserves forms and retries failures
        run: node --test tests/web_progress.test.cjs
