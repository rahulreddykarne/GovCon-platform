[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govcon"
version = "0.1.0"
description = "GovCon opportunity and bid management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=1.11",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "reportlab>=4.2",
    "sqlalchemy>=2.0.36",
    "tenacity>=8.2",
    "typer>=0.12",
    "uvicorn>=0.32",
    "fastmcp>=4.0",
    "sentence-transformers>=3.0",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "apscheduler>=3.10",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy==2.4.0",
    "ruff==0.16.10",
    "types-openpyxl==3.1.5.20260827",
    "types-reportlab==5.0.0.20260911",
    "types-setuptools==84.0.0.20260812",
]

[project.scripts]
govcon = "govcon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govcon = ["prompts/**/*.md", "prompts/**/*.yaml", "compliance/data/*.json", "web/templates/**/*.html", "web/templates/*.html", "web/static/**/*", "web/static/*"]

[tool.setuptools.cmdclass]
build_py = "govcon._build.BuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff.lint.flake8-bugbear]
# Typer's documented API is a function call in the default. B008 stays enabled
# for every other call.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# Local stubs for installed packages that have no py.typed marker (see stubs/README.md).
mypy_path = "stubs"
