[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govcon"
version = "0.1.0"
description = "GovCon opportunity and bid management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "sqlalchemy>=2.0.36",
    "tenacity>=8.2",
    "typer>=0.12",
    "uvicorn>=0.32",
    "fastmcp>=4.0",
    "sentence-transformers>=3.0",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
govcon = "govcon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govcon = ["prompts/**/*.md", "prompts/**/*.yaml", "compliance/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
