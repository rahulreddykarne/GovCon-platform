{% extends "base.html" %}
{% block title %}Invite User — GovCon{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}

<div class="page-header">
  <div><h1 class="page-title">Invite User</h1></div>
  <a href="/ops" class="btn btn-secondary">← Back</a>
</div>

{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
{% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}

<div class="card">
  <form method="post" action="/admin/users/invite">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="display_name">Display Name *</label>
      <input type="text" id="display_name" name="display_name" required>
    </div>
    <div class="form-group">
      <label for="password">Initial Password * (min 12 chars)</label>
      <input type="password" id="password" name="password" required minlength="12">
    </div>
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="reviewer">reviewer</option>
        <option value="approver">approver</option>
        <option value="read_only">read_only</option>
        <option value="owner">owner</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Invite User</button>
  </form>
</div>

{% endblock %}
