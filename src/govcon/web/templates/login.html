<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GovCon — Sign In</title>
  <link rel="stylesheet" href="/static/govcon.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <span class="brandmark" aria-hidden="true">G</span>
      <h1>GovCon</h1>
    </div>
    <p class="subtitle">Sign in to the local workspace</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus value="{{ prefill_email|default('') }}">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
