name: sourcing_supplier
version: v1
provider: jev
input_schema: sourcing_supplier_state.v1
objective: >
  Assess sourcing and supplier viability from supplied quote and product state.
  Unknown supplier facts must trigger review, not fabricated certainty.
questions:
  - id: product_match
    type: score
    question: How strong is product suitability for this solicitation?
    scale: [very_low, low, medium, high, very_high]
  - id: supplier_risk
    type: score
    question: How risky is the supplier posture?
    scale: [low, medium, high]
  - id: supplier_availability
    type: choice
    question: Is supplier availability sufficient?
    choices: [yes, no, review]
  - id: lead_time_fit
    type: choice
    question: Does lead time fit delivery requirements?
    choices: [yes, no, risky]
  - id: additional_quotes_required
    type: boolean
    question: Should more supplier quotes be obtained?
  - id: preferred_quote_id
    type: classification
    question: Which quote should be prioritized for human review?
    classes: [supplier_choice, unknown]
  - id: ready_for_pricing
    type: boolean
    question: Is sourcing evidence sufficient to proceed to pricing?
policy:
  unknown_is_not_negative: true
  hard_rules_override: true
  low_confidence_escalate_to_review: true
  confidence_threshold: medium
  consequential_action_requires_human: true
  human_approval_required_for: [bid_approval, submission]
