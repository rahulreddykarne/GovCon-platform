name: collaborative_review
version: v1
provider: jev
input_schema: collaborative_review_state.v1
objective: >
  Synthesize collaborative review posture after required reviewers complete their
  evaluations. This bundle never grants final bid approval.
questions:
  - id: review_policy
    type: classification
    question: What review policy applies?
    classes: [single, dual, conditional]
  - id: quorum_satisfied
    type: boolean
    question: Is review quorum satisfied?
  - id: second_review_required
    type: boolean
    question: Is a second review required?
  - id: reviewer_alignment
    type: classification
    question: How aligned are reviewers?
    classes: [single_reviewer, aligned, mixed, conflicting]
  - id: evidence_confidence
    type: score
    question: Confidence level of synthesis evidence.
    scale: [low, medium, high]
  - id: recommendation
    type: choice
    question: What recommendation should be carried to the approval gate?
    choices: [bid, no_bid, review]
  - id: approval_gate_status
    type: classification
    question: What is approval gate status?
    classes: [human_decision_required, needs_more_review, ready]
policy:
  unknown_is_not_negative: true
  hard_rules_override: true
  low_confidence_escalate_to_review: true
  confidence_threshold: medium
  consequential_action_requires_human: true
  human_approval_required_for: [bid_approved, submitted]
