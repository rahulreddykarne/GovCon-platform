name: opportunity_triage
version: v1
provider: jev
input_schema: opportunity_triage_state.v1
objective: >
  Triage opportunity relevance and urgency using source-backed state only.
  Prefer review when evidence is incomplete.
questions:
  - id: relevance
    type: choice
    question: Is this opportunity relevant to our business?
    choices: [relevant, not_relevant, review]
  - id: initial_fit
    type: score
    question: How strong is initial fit based on available evidence?
    scale: [very_low, low, medium, high, very_high]
  - id: priority
    type: choice
    question: What priority should this opportunity receive?
    choices: [low, medium, high, critical]
  - id: deep_analysis_required
    type: boolean
    question: Should this opportunity receive deeper analysis now?
  - id: attachment_analysis_required
    type: boolean
    question: Should attachment analysis be performed?
  - id: deadline_risk
    type: score
    question: How severe is deadline risk?
    scale: [low, medium, high, critical]
  - id: human_review_required
    type: boolean
    question: Should this opportunity be escalated for human review?
  - id: next_action
    type: classification
    question: What should happen next in workflow routing?
    classes: [dismiss, analyze, review, pursue, wait]
policy:
  unknown_is_not_negative: true
  hard_rules_override: true
  low_confidence_escalate_to_review: true
  confidence_threshold: medium
  consequential_action_requires_human: true
  human_approval_required_for: [bid_approval, submission]
