name: bid_decision
version: v1
provider: jev
input_schema: bid_decision_state.v1
objective: >
  Produce preliminary bid/no-bid routing signals from supplied evidence-backed
  state. Never invent missing facts. Human decision remains authoritative.
questions:
  - id: recommendation
    type: choice
    question: Should this opportunity be recommended for bidding?
    choices: [bid, no_bid, review]
  - id: opportunity_strength
    type: score
    question: How strong is the opportunity overall?
    scale: [very_low, low, medium, high, very_high]
  - id: evidence_confidence
    type: score
    question: How confident is the available evidence?
    scale: [low, medium, high]
  - id: sufficient_information
    type: boolean
    question: Is there enough evidence to recommend BID?
  - id: unresolved_no_bid_issue
    type: boolean
    question: Does an unresolved issue justify NO BID?
  - id: execution_risk
    type: score
    question: What is overall execution risk?
    scale: [low, medium, high, critical]
  - id: commercial_attractiveness
    type: score
    question: What is overall commercial attractiveness?
    scale: [very_low, low, medium, high, very_high]
  - id: compliance_risk
    type: score
    question: What is overall compliance risk?
    scale: [low, medium, high, critical]
  - id: human_review_required
    type: boolean
    question: Should a human decide before progression?
  - id: recommend_bid_approval
    type: boolean
    question: Should this move toward bid_approved pending human confirmation?
policy:
  unknown_is_not_negative: true
  hard_rules_override: true
  low_confidence_escalate_to_review: true
  confidence_threshold: medium
  consequential_action_requires_human: true
  human_approval_required_for: [bid_approved, submitted]
