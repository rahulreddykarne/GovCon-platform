name: outcome_learning
version: v1
provider: jev
input_schema: outcome_learning_state.v1
objective: >
  Classify documented outcome evidence for future learning. Unknown causes
  must remain unknown when evidence is absent.
questions:
  - id: no_bid_reason
    type: classification
    question: What category best fits documented no-bid reason?
    classes: [pricing, compliance, sourcing, deadline, capacity, strategic, unknown]
  - id: loss_reason
    type: classification
    question: What category best fits documented loss reason?
    classes: [pricing, compliance, sourcing, deadline, incumbent, technical, unknown]
  - id: pricing_factor
    type: choice
    question: Was pricing a meaningful factor?
    choices: [yes, no, unknown]
  - id: compliance_factor
    type: choice
    question: Was compliance a meaningful factor?
    choices: [yes, no, unknown]
  - id: sourcing_factor
    type: choice
    question: Was sourcing a meaningful factor?
    choices: [yes, no, unknown]
  - id: deadline_factor
    type: choice
    question: Was deadline pressure a meaningful factor?
    choices: [yes, no, unknown]
  - id: use_for_future_analysis
    type: boolean
    question: Should this outcome be reused in future analysis?
  - id: similarity_relevance
    type: score
    question: How relevant is this outcome to future opportunities?
    scale: [low, medium, high]
policy:
  unknown_is_not_negative: true
  hard_rules_override: true
  low_confidence_escalate_to_review: true
  confidence_threshold: medium
  consequential_action_requires_human: true
  human_approval_required_for: [bid_approved, submitted]
