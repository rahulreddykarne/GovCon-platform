name: workflow_router
version: v1
provider: jev
input_schema: workflow_router_state.v1
objective: >
  Route next workflow action from available evidence while preserving human
  authority for consequential transitions.
questions:
  - id: next_action
    type: choice
    question: What should happen next?
    choices: [dismiss, analyze, review, pursue, wait]
  - id: recommended_stage
    type: classification
    question: Which workflow stage should receive this item?
    classes: [evaluating, review, ready_for_collaborative_review, ready_to_submit, submitted, no_bid]
  - id: user_attention_required
    type: boolean
    question: Does this require immediate user attention?
  - id: safe_to_continue_automatically
    type: boolean
    question: Is automated processing safe to continue?
  - id: sufficient_evidence
    type: boolean
    question: Is sufficient evidence available to continue automatically?
  - id: defer_until_more_information
    type: boolean
    question: Should this be deferred pending more information?
  - id: rerun_analysis
    type: boolean
    question: Should analysis be re-run due to material source changes?
policy:
  unknown_is_not_negative: true
  hard_rules_override: true
  low_confidence_escalate_to_review: true
  confidence_threshold: medium
  consequential_action_requires_human: true
  human_approval_required_for: [bid_approved, submitted]
